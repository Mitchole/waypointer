plugins {
    id 'java'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.runelite.net' }
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:3.1.0'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
}

group = 'com.waypointer'
version = '0.1.8'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(11)
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.named('test') {
    useJUnit()
    // Required for NearestLandmarkBarTest: reads AbstractButton.disabledIcon via
    // reflection to assert that applySprite called setDisabledIcon explicitly
    // rather than relying on the LAF's lazy auto-synthesis.
    jvmArgs '--add-opens', 'java.desktop/javax.swing=ALL-UNNAMED'
    testLogging {
        events 'failed', 'skipped'
        showStandardStreams = false
        exceptionFormat = 'full'
    }
}

task run(type: JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = 'com.waypointer.WaypointerPluginTest'
    args = ['--developer-mode', '--debug']
    jvmArgs = ['-ea']
}

// Dev tool: bake an exported landmark override into the bundled .tsv resources.
//   ./gradlew bakeLandmarks                  (reads the override JSON from the clipboard)
//   ./gradlew bakeLandmarks -Pexport=x.json  (reads it from a file instead)
task bakeLandmarks(type: JavaExec) {
    group = 'waypointer'
    description = 'Bake an exported landmark override (clipboard, or -Pexport=<file>) into src/main/resources TSVs.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.waypointer.tools.LandmarkOverrideBaker'
    systemProperty 'java.awt.headless', 'false'
    systemProperty 'waypointer.landmarksDir', file('src/main/resources/com/waypointer/landmarks').absolutePath
    if (project.hasProperty('export')) {
        args = [project.property('export')]
    }
}

task shadowJar(type: Jar) {
    archiveClassifier = 'all'
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
